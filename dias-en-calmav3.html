<style>
:root{
  --bg:#F4EEE3;--ink:#33403B;--muted:#7C877F;
  --glass:rgba(255,253,247,.58);--glass-line:rgba(255,255,255,.75);--shadow:rgba(120,110,90,.16);
  --calm:#6E9A86;--calm-2:#9BBFA9;--calm-ink:#FFFFFF;--tense:#C0826B;--chip:rgba(110,154,134,.14);
  --b1:#BBD3C2;--b2:#C5DBE8;--b3:#EBDCC0;--blob-o:.85;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0c10;--ink:#E9EBF3;--muted:#9A9DB3;
    --glass:rgba(28,29,42,.48);--glass-line:rgba(255,255,255,.09);--shadow:rgba(0,0,0,.45);
    --calm:#9FDCC0;--calm-2:#7FBFA4;--calm-ink:#0b0c10;--tense:#E3A18C;--chip:rgba(159,220,192,.12);
    --b1:#8E7CD6;--b2:#B79BE0;--b3:#4F9C86;--blob-o:.42;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0c10;--ink:#E9EBF3;--muted:#9A9DB3;
  --glass:rgba(28,29,42,.48);--glass-line:rgba(255,255,255,.09);--shadow:rgba(0,0,0,.45);
  --calm:#9FDCC0;--calm-2:#7FBFA4;--calm-ink:#0b0c10;--tense:#E3A18C;--chip:rgba(159,220,192,.12);
  --b1:#8E7CD6;--b2:#B79BE0;--b3:#4F9C86;--blob-o:.42;color-scheme:dark;
}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px);transition:background-color .8s ease}
*{box-sizing:border-box}
body{margin:0;min-height:100%;color:var(--ink);background:transparent;
  font:300 17px/1.6 "Outfit",-apple-system,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%;
  transition:color .8s ease}

.aurora{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:var(--blob-o);will-change:transform;transition:opacity .8s ease,background-color .8s ease}
.b1{width:70vmax;height:70vmax;left:-25vmax;top:-25vmax;background:var(--b1);animation:d1 42s ease-in-out infinite alternate}
.b2{width:60vmax;height:60vmax;right:-22vmax;top:20vh;background:var(--b2);animation:d2 55s ease-in-out infinite alternate}
.b3{width:65vmax;height:65vmax;left:-10vmax;bottom:-30vmax;background:var(--b3);animation:d3 48s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(18vmax,12vmax) scale(1.15)}}
@keyframes d2{to{transform:translate(-16vmax,-10vmax) scale(1.2)}}
@keyframes d3{to{transform:translate(14vmax,-12vmax) scale(1.1)}}
@media (prefers-reduced-motion: reduce){.blob{animation:none}}

main{position:relative;z-index:1;max-width:460px;margin:0 auto;padding:34px 22px 56px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{font-size:15px;font-weight:300;color:var(--muted);margin:0;letter-spacing:.02em;text-transform:capitalize}

.hero{text-align:center;padding:40px 0 12px}
.big{font-size:140px;line-height:1;font-weight:200;letter-spacing:-.05em;margin:0;color:var(--calm)}
.big small{display:block;font-size:19px;font-weight:300;letter-spacing:.02em;color:var(--ink);margin-top:10px}
.record{color:var(--muted);margin:18px 0 0}
.record b{color:var(--ink);font-weight:400}

.card{background:var(--glass);border:1px solid var(--glass-line);border-radius:28px;padding:26px;margin-top:26px;
  -webkit-backdrop-filter:blur(22px) saturate(140%);backdrop-filter:blur(22px) saturate(140%);
  box-shadow:0 18px 40px -18px var(--shadow);transition:background-color .8s ease,border-color .8s ease}
.card h2{font-size:17px;margin:0 0 18px;font-weight:400}

button{font:inherit;font-weight:300;cursor:pointer;border-radius:22px;border:1px solid var(--glass-line);padding:16px 20px;
  background:var(--glass);color:var(--ink);text-align:center;
  box-shadow:inset 0 1px 1px rgba(255,255,255,.35),0 8px 18px -8px var(--shadow);
  transition:transform .25s ease,box-shadow .25s ease,background-color .4s ease,color .4s ease,border-color .4s ease}
button:hover{transform:translateY(-2px);box-shadow:inset 0 1px 1px rgba(255,255,255,.4),0 14px 24px -10px var(--shadow)}
button:active{transform:translateY(1px) scale(.985);box-shadow:inset 0 2px 6px var(--shadow)}
button:focus-visible,input:focus-visible{outline:2px solid var(--calm);outline-offset:3px}
.actions{display:grid;gap:14px}
.calm{background:linear-gradient(145deg,var(--calm-2),var(--calm));color:var(--calm-ink);border-color:transparent}
.tense{color:var(--tense)}
.on{box-shadow:0 0 0 3px var(--chip),0 0 0 4px currentColor}
.status{margin:20px 0 0;color:var(--muted);min-height:1.6em}

.dots{display:grid;grid-template-columns:repeat(7,1fr);gap:12px}
.dot{aspect-ratio:1;border-radius:50%;border:1px solid var(--glass-line);background:var(--chip);
  display:grid;place-items:center;font-size:13px;color:var(--muted)}
.dot.c{background:linear-gradient(145deg,var(--calm-2),var(--calm));border-color:transparent;color:var(--calm-ink)}
.dot.f{background:var(--tense);border-color:transparent;color:#fff}
.dot.t{border:1.5px solid var(--ink);color:var(--ink)}

.row{display:flex;gap:10px}
input{flex:1;min-width:0;font:inherit;font-weight:300;padding:14px 18px;border-radius:20px;border:1px solid var(--glass-line);
  background:var(--chip);color:var(--ink);box-shadow:inset 0 2px 6px var(--shadow)}
input::placeholder{color:var(--muted)}
.row button{padding:14px 20px;background:linear-gradient(145deg,var(--calm-2),var(--calm));color:var(--calm-ink);border-color:transparent}
ul{list-style:none;margin:18px 0 0;padding:0}
li{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--glass-line)}
li button{padding:6px 14px;font-size:14px;color:var(--muted);flex:none;border-radius:16px}
.hint{color:var(--muted);font-size:15px;margin:16px 0 0}

#b-theme{padding:9px 16px;font-size:14px;border-radius:999px;color:var(--muted)}
.foot{text-align:center;margin-top:34px}
.foot button{border:0;background:none;box-shadow:none;color:var(--muted);font-size:13px;text-decoration:underline;padding:8px}
.foot button:hover{transform:none;box-shadow:none}
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<main>
  <header>
    <h1 id="fecha"></h1>
    <button id="b-theme" type="button" aria-label="Cambiar entre modo día y noche">Noche</button>
  </header>
  <section class="hero" aria-live="polite">
    <p class="big"><span id="racha">0</span><small id="racha-label">días en calma</small></p>
    <p class="record">Tu récord: <b id="record">0</b> días</p>
  </section>

  <section class="card">
    <h2>¿Cómo fue hoy?</h2>
    <div class="actions">
      <button class="calm" id="b-calm">Día en calma</button>
      <button class="tense" id="b-fight">Hubo una pelea</button>
    </div>
    <p class="status" id="status"></p>
  </section>

  <section class="card">
    <h2>Últimos 14 días</h2>
    <div class="dots" id="dots"></div>
  </section>

  <section class="card">
    <h2>Para hablar con calma después</h2>
    <div class="row">
      <input id="nota" type="text" placeholder="Algo que me molestó…" maxlength="140" aria-label="Nueva nota">
      <button id="b-nota">Guardar</button>
    </div>
    <ul id="notas"></ul>
    <p class="hint" id="hint">Si algo te dan ganas de hablar ahora, anótalo aquí y elige un momento tranquilo para conversarlo.</p>
  </section>

  <div class="foot"><button id="b-reset">Borrar todos los datos</button></div>
</main>

<script>
(function(){
  var K = 'dias-en-calma-v1', KT = 'dias-en-calma-theme';
  var state = { log: {}, notes: [] };
  try { var raw = localStorage.getItem(K); if (raw) state = JSON.parse(raw); } catch (e) {}
  if (!state.log) state.log = {};
  if (!state.notes) state.notes = [];

  function save(){ try { localStorage.setItem(K, JSON.stringify(state)); } catch (e) {} }
  function key(d){ var m = d.getMonth()+1, day = d.getDate(); return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(day<10?'0':'')+day; }
  function addDays(d, n){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()+n); }
  function $(id){ return document.getElementById(id); }

  /* Tema día / noche */
  var root = document.documentElement;
  function systemDark(){ return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches; }
  function currentTheme(){ return root.getAttribute('data-theme') || (systemDark() ? 'dark' : 'light'); }
  function paintToggle(){ $('b-theme').textContent = currentTheme() === 'dark' ? 'Día' : 'Noche'; }
  try { var st = localStorage.getItem(KT); if (st === 'dark' || st === 'light') root.setAttribute('data-theme', st); } catch (e) {}
  $('b-theme').addEventListener('click', function(){
    var next = currentTheme() === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem(KT, next); } catch (e) {}
    paintToggle();
  });
  paintToggle();

  function run(from){
    var n = 0, d = from;
    while (state.log[key(d)] === 'calm'){ n++; d = addDays(d, -1); }
    return n;
  }
  function current(){
    var today = new Date(), t = state.log[key(today)];
    if (t === 'fight') return 0;
    if (t === 'calm') return run(today);
    return run(addDays(today, -1));
  }
  function record(){
    var keys = Object.keys(state.log).filter(function(k){ return state.log[k]==='calm'; }).sort();
    var best = 0, cur = 0, prev = null;
    keys.forEach(function(k){
      var p = k.split('-'), d = new Date(+p[0], +p[1]-1, +p[2]);
      if (prev && key(addDays(prev, 1)) === k) cur++; else cur = 1;
      if (cur > best) best = cur;
      prev = d;
    });
    return best;
  }

  function render(){
    var today = new Date(), tk = key(today), v = state.log[tk];
    $('fecha').textContent = today.toLocaleDateString('es', { weekday:'long', day:'numeric', month:'long' });
    var n = current();
    $('racha').textContent = n;
    $('racha-label').textContent = n === 1 ? 'día en calma' : 'días en calma';
    $('record').textContent = Math.max(record(), 0);
    $('b-calm').classList.toggle('on', v === 'calm');
    $('b-fight').classList.toggle('on', v === 'fight');
    $('status').textContent = v === 'calm' ? 'Hoy quedó registrado como día en calma.'
      : v === 'fight' ? 'Pasó. Mañana empieza otra racha y lo que aprendiste cuenta.'
      : 'Aún no has registrado hoy.';

    var dots = '';
    for (var i = 13; i >= 0; i--){
      var d = addDays(today, -i), s = state.log[key(d)];
      var cls = 'dot' + (s === 'calm' ? ' c' : s === 'fight' ? ' f' : '') + (i === 0 ? ' t' : '');
      dots += '<div class="'+cls+'" title="'+key(d)+'">'+d.getDate()+'</div>';
    }
    $('dots').innerHTML = dots;

    var ul = $('notas'); ul.innerHTML = '';
    state.notes.forEach(function(t, idx){
      var li = document.createElement('li'), sp = document.createElement('span'), b = document.createElement('button');
      sp.textContent = t; b.textContent = 'Ya lo hablamos';
      b.addEventListener('click', function(){ state.notes.splice(idx, 1); save(); render(); });
      li.appendChild(sp); li.appendChild(b); ul.appendChild(li);
    });
  }

  $('b-calm').addEventListener('click', function(){ state.log[key(new Date())] = 'calm'; save(); render(); });
  $('b-fight').addEventListener('click', function(){ state.log[key(new Date())] = 'fight'; save(); render(); });
  function addNote(){
    var i = $('nota'), t = i.value.trim();
    if (!t) return;
    state.notes.unshift(t); i.value = ''; save(); render();
  }
  $('b-nota').addEventListener('click', addNote);
  $('nota').addEventListener('keydown', function(e){ if (e.key === 'Enter') addNote(); });
  $('b-reset').addEventListener('click', function(){
    if (confirm('¿Borrar racha, récord y notas?')) { state = { log:{}, notes:[] }; save(); render(); }
  });
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) render(); });
  window.addEventListener('pageshow', render);
  render();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="En calma">
<title>Días en calma</title>
<style>
:root{
  --bg:#EEF2EC;--surface:#FBFCFA;--ink:#1D2B26;--muted:#5E6F67;--line:#D3DCD3;
  --calm:#2F6B57;--calm-ink:#FFFFFF;--tense:#B4553B;--soft:#DCE6DE;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121A17;--surface:#1A2420;--ink:#E8EFEA;--muted:#93A59B;--line:#2B3A34;
    --calm:#6FBF9F;--calm-ink:#0F1A16;--tense:#E08A6F;--soft:#24332D;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121A17;--surface:#1A2420;--ink:#E8EFEA;--muted:#93A59B;--line:#2B3A34;
  --calm:#6FBF9F;--calm-ink:#0F1A16;--tense:#E08A6F;--soft:#24332D;color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font:16px/1.5 Georgia,"Iowan Old Style","Times New Roman",serif;-webkit-text-size-adjust:100%}
main{max-width:460px;margin:0 auto;padding:24px 20px 40px}
h1{font-size:15px;font-weight:400;color:var(--muted);margin:0 0 4px}
.hero{text-align:center;padding:12px 0 8px}
.big{font-size:132px;line-height:1;font-weight:400;letter-spacing:-0.04em;color:var(--calm);margin:0}
.big small{display:block;font-size:20px;letter-spacing:0;color:var(--ink);margin-top:6px}
.record{color:var(--muted);margin:10px 0 0}
.record b{color:var(--ink);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:18px}
.card h2{font-size:17px;margin:0 0 12px;font-weight:600}
.actions{display:grid;gap:10px}
button{font:inherit;cursor:pointer;border-radius:14px;border:1px solid var(--line);padding:14px 16px;background:var(--surface);color:var(--ink);text-align:left}
button:focus-visible,input:focus-visible{outline:3px solid var(--calm);outline-offset:2px}
.calm{background:var(--calm);color:var(--calm-ink);border-color:var(--calm)}
.tense{color:var(--tense);border-color:var(--tense)}
.on{box-shadow:0 0 0 3px var(--soft),0 0 0 4px currentColor}
.status{margin:12px 0 0;color:var(--muted);min-height:1.5em}
.dots{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.dot{aspect-ratio:1;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--muted)}
.dot.c{background:var(--calm);border-color:var(--calm);color:var(--calm-ink)}
.dot.f{background:var(--tense);border-color:var(--tense);color:#fff}
.dot.t{border-color:var(--ink);color:var(--ink)}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.row button{text-align:center;padding:12px 16px;background:var(--ink);color:var(--bg);border-color:var(--ink)}
ul{list-style:none;margin:12px 0 0;padding:0}
li{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
li button{padding:4px 10px;font-size:14px;color:var(--muted);flex:none}
.hint{color:var(--muted);font-size:14px;margin:10px 0 0}
.foot{text-align:center;margin-top:22px}
.foot button{border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;text-align:center}
</style>
</head>
<body>
<main>
  <h1 id="fecha"></h1>
  <section class="hero" aria-live="polite">
    <p class="big"><span id="racha">0</span><small id="racha-label">días en calma</small></p>
    <p class="record">Tu récord: <b id="record">0</b> días</p>
  </section>

  <section class="card">
    <h2>¿Cómo fue hoy?</h2>
    <div class="actions">
      <button class="calm" id="b-calm">Día en calma</button>
      <button class="tense" id="b-fight">Hubo una pelea</button>
    </div>
    <p class="status" id="status"></p>
  </section>

  <section class="card">
    <h2>Últimos 14 días</h2>
    <div class="dots" id="dots"></div>
  </section>

  <section class="card">
    <h2>Para hablar con calma después</h2>
    <div class="row">
      <input id="nota" type="text" placeholder="Algo que me molestó…" maxlength="140" aria-label="Nueva nota">
      <button id="b-nota">Guardar</button>
    </div>
    <ul id="notas"></ul>
    <p class="hint" id="hint">Si algo te dan ganas de hablar ahora, anótalo aquí y elige un momento tranquilo para conversarlo.</p>
  </section>

  <div class="foot"><button id="b-reset">Borrar todos los datos</button></div>
</main>

<script>
(function(){
  var K = 'dias-en-calma-v1';
  var state = { log: {}, notes: [] };
  try { var raw = localStorage.getItem(K); if (raw) state = JSON.parse(raw); } catch (e) {}
  if (!state.log) state.log = {};
  if (!state.notes) state.notes = [];

  function save(){ try { localStorage.setItem(K, JSON.stringify(state)); } catch (e) {} }
  function key(d){ var m = d.getMonth()+1, day = d.getDate(); return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(day<10?'0':'')+day; }
  function addDays(d, n){ var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()+n); return x; }
  function $(id){ return document.getElementById(id); }

  function run(from){
    var n = 0, d = from;
    while (state.log[key(d)] === 'calm'){ n++; d = addDays(d, -1); }
    return n;
  }
  function current(){
    var today = new Date(), t = state.log[key(today)];
    if (t === 'fight') return 0;
    if (t === 'calm') return run(today);
    return run(addDays(today, -1));
  }
  function record(){
    var keys = Object.keys(state.log).filter(function(k){ return state.log[k]==='calm'; }).sort();
    var best = 0, cur = 0, prev = null;
    keys.forEach(function(k){
      var p = k.split('-'), d = new Date(+p[0], +p[1]-1, +p[2]);
      if (prev && key(addDays(prev, 1)) === k) cur++; else cur = 1;
      if (cur > best) best = cur;
      prev = d;
    });
    return best;
  }

  function render(){
    var today = new Date(), tk = key(today), v = state.log[tk];
    $('fecha').textContent = today.toLocaleDateString('es', { weekday:'long', day:'numeric', month:'long' });
    var n = current();
    $('racha').textContent = n;
    $('racha-label').textContent = n === 1 ? 'día en calma' : 'días en calma';
    $('record').textContent = Math.max(record(), 0);
    $('b-calm').classList.toggle('on', v === 'calm');
    $('b-fight').classList.toggle('on', v === 'fight');
    $('status').textContent = v === 'calm' ? 'Hoy quedó registrado como día en calma.'
      : v === 'fight' ? 'Pasó. Mañana empieza otra racha y lo que aprendiste cuenta.'
      : 'Aún no has registrado hoy.';

    var dots = '';
    for (var i = 13; i >= 0; i--){
      var d = addDays(today, -i), s = state.log[key(d)];
      var cls = 'dot' + (s === 'calm' ? ' c' : s === 'fight' ? ' f' : '') + (i === 0 ? ' t' : '');
      dots += '<div class="'+cls+'" title="'+key(d)+'">'+d.getDate()+'</div>';
    }
    $('dots').innerHTML = dots;

    var ul = $('notas'); ul.innerHTML = '';
    state.notes.forEach(function(t, idx){
      var li = document.createElement('li'), sp = document.createElement('span'), b = document.createElement('button');
      sp.textContent = t; b.textContent = 'Ya lo hablamos';
      b.addEventListener('click', function(){ state.notes.splice(idx, 1); save(); render(); });
      li.appendChild(sp); li.appendChild(b); ul.appendChild(li);
    });
  }

  $('b-calm').addEventListener('click', function(){ state.log[key(new Date())] = 'calm'; save(); render(); });
  $('b-fight').addEventListener('click', function(){ state.log[key(new Date())] = 'fight'; save(); render(); });
  function addNote(){
    var i = $('nota'), t = i.value.trim();
    if (!t) return;
    state.notes.unshift(t); i.value = ''; save(); render();
  }
  $('b-nota').addEventListener('click', addNote);
  $('nota').addEventListener('keydown', function(e){ if (e.key === 'Enter') addNote(); });
  $('b-reset').addEventListener('click', function(){
    if (confirm('¿Borrar racha, récord y notas?')) { state = { log:{}, notes:[] }; save(); render(); }
  });
  render();
})();
</script>
</body>
</html>
